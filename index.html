<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Digi Saving</title>
  <meta name="theme-color" content="#0f766e">
  <meta name="description" content="Digi Saving แอปช่วยบันทึกเงินออม">

  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Digi Saving">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f0fdfa;
      color: #134e4a;
    }

    header {
      background: #0f766e;
      color: white;
      text-align: center;
      padding: 24px 16px;
    }

    main {
      max-width: 480px;
      margin: 24px auto;
      padding: 20px;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 4px 14px #00000010;
    }

    label {
      display: block;
      margin-top: 14px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 12px;
      margin-top: 8px;
      border: 1px solid #99f6e4;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 16px;
      border: none;
      border-radius: 8px;
      background: #0f766e;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    .balance {
      font-size: 28px;
      font-weight: bold;
      text-align: center;
      margin: 20px 0;
    }

    ul {
      padding-left: 20px;
      overflow-wrap: anywhere;
    }
  </style>
</head>

<body>
  <header>
    <h1>Digi Saving</h1>
    <p>บันทึกเงินออมของคุณ</p>
  </header>

  <main>
    <section class="card">
      <h2>เงินออมทั้งหมด</h2>
      <div class="balance" id="balance">0.00 บาท</div>

      <label for="amount">จำนวนเงิน (บาท)</label>
      <input
        type="number"
        id="amount"
        min="0.01"
        step="0.01"
        placeholder="กรอกจำนวนเงิน"
      >

      <label for="note">บันทึกช่วยจำ</label>
      <input
        type="text"
        id="note"
        maxlength="100"
        placeholder="เช่น เงินออมประจำวัน"
      >

      <button id="saveButton" type="button">บันทึกเงินออม</button>

      <h3>รายการเงินออม</h3>
      <ul id="history"></ul>
    </section>
  </main>

  <script>
    const amountInput = document.getElementById("amount");
    const noteInput = document.getElementById("note");
    const balanceElement = document.getElementById("balance");
    const historyElement = document.getElementById("history");
    const saveButton = document.getElementById("saveButton");

    let savings = [];

    try {
      const savedData = localStorage.getItem("digiSavingData");
      const parsedData = savedData ? JSON.parse(savedData) : [];

      if (Array.isArray(parsedData)) {
        savings = parsedData.filter(item =>
          item &&
          typeof item.amount === "number" &&
          Number.isFinite(item.amount) &&
          item.amount > 0 &&
          typeof item.note === "string"
        );
      }
    } catch (error) {
      savings = [];
    }

    function render() {
      const total = savings.reduce(
        (sum, item) => sum + item.amount,
        0
      );

      balanceElement.textContent =
        total.toLocaleString("th-TH", {
          minimumFractionDigits: 2,
          maximumFractionDigits: 2
        }) + " บาท";

      historyElement.replaceChildren();

      savings.forEach(item => {
        const li = document.createElement("li");
        li.textContent =
          item.note + " — " +
          item.amount.toLocaleString("th-TH", {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
          }) + " บาท";

        historyElement.appendChild(li);
      });
    }

    saveButton.addEventListener("click", () => {
      const amount = Number(amountInput.value);
      const note = noteInput.value.trim() || "เงินออม";

      if (!Number.isFinite(amount) || amount <= 0) {
        alert("กรุณากรอกจำนวนเงินที่มากกว่า 0");
        return;
      }

      savings.push({ amount, note });

      try {
        localStorage.setItem(
          "digiSavingData",
          JSON.stringify(savings)
        );
      } catch (error) {
        savings.pop();
        alert("บันทึกข้อมูลไม่ได้ กรุณาตรวจสอบพื้นที่จัดเก็บ");
        return;
      }

      amountInput.value = "";
      noteInput.value = "";
      render();
    });

    render();

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js")
          .catch(error => {
            console.error("Service Worker registration failed:", error);
          });
      });
    }
  </script>
</body>
</html>
